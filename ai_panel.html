<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCADA AI Contextual Panel</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --fg: #cdd6f4;
            --accent: #89b4fa;
            --panel: #313244;
            --input: #45475a;
            --success: #a6e3a1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
        }

        .config-panel {
            background: var(--panel);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        select,
        input,
        textarea,
        button {
            background: var(--input);
            color: var(--fg);
            border: 1px solid var(--accent);
            padding: 8px;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }

        button {
            cursor: pointer;
            background: var(--accent);
            color: var(--bg);
            font-weight: bold;
            border: none;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 350px 1fr 1fr;
            gap: 20px;
            flex-grow: 1;
            overflow: hidden;
        }

        .box {
            background: var(--panel);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            font-size: 12px;
            color: var(--accent);
        }

        pre {
            background: #181825;
            padding: 10px;
            border-radius: 4px;
            overflow: auto;
            font-size: 11px;
            flex-grow: 1;
            margin: 0;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            overflow: hidden;
        }

        #chat-output {
            background: #181825;
            padding: 10px;
            border-radius: 4px;
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 13px;
        }

        .input-group {
            display: flex;
            gap: 5px;
        }

        .input-group input {
            flex-grow: 1;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--accent);
            border-bottom: 1px solid #45475a;
            padding-bottom: 5px;
        }

        .scrollable {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Industrial AI Contextual Helper & Config</h1>
        </div>

        <div class="config-panel">
            <label for="tag-select">Tag Activo:</label>
            <select id="tag-select" style="flex-grow: 1;"></select>
            <button onclick="loadContext()">Cargar Contexto</button>
        </div>

        <div class="main-layout">
            <!-- Columna 1: Configuración -->
            <div class="box">
                <h3>🛠️ Configurar Sensor</h3>
                <div class="scrollable" id="metadata-form">
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="meta-desc" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Rol en el Proceso</label>
                        <input type="text" id="meta-role">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Rango Normal Min</label>
                            <input type="number" id="meta-nmin" step="any">
                        </div>
                        <div class="form-group">
                            <label>Rango Normal Max</label>
                            <input type="number" id="meta-nmax" step="any">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Crítico Min</label>
                            <input type="number" id="meta-cmin" step="any">
                        </div>
                        <div class="form-group">
                            <label>Crítico Max</label>
                            <input type="number" id="meta-cmax" step="any">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Ubicación Física</label>
                        <input type="text" id="meta-loc">
                    </div>
                    <div class="form-group">
                        <label>Sistema Relacionado</label>
                        <input type="text" id="meta-sys">
                    </div>
                    <div class="form-group">
                        <label>Impacto de Falla</label>
                        <textarea id="meta-impact" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Notas Operativas</label>
                        <textarea id="meta-notes" rows="2"></textarea>
                    </div>
                    <button id="save-btn" onclick="saveMetadata()"
                        style="width: 100%; background: var(--success); color: #111; margin-top: 10px;">💾 Guardar
                        Cambios</button>
                </div>
            </div>

            <!-- Columna 2: Datos Crudos -->
            <div class="box">
                <h3>📊 Contexto Consolidado (JSON)</h3>
                <pre id="context-json">Selecciona un tag y pulsa cargar...</pre>
            </div>

            <!-- Columna 3: Chat IA -->
            <div class="box">
                <h3>🤖 Consultas IA Industrial</h3>
                <div class="chat-container">
                    <div id="chat-output">Pregunta algo sobre el sensor...</div>
                    <div class="input-group">
                        <input type="text" id="user-question" placeholder="¿Cómo está el sensor?"
                            onkeypress="if(event.key==='Enter') sendQuestion()">
                        <button onclick="sendQuestion()">Preguntar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function init() {
            try {
                const response = await fetch('/tags');
                const tags = await response.json();
                const select = document.getElementById('tag-select');
                Object.keys(tags).sort().forEach(tag => {
                    const opt = document.createElement('option');
                    opt.value = tag;
                    opt.textContent = tag;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("Error cargando tags:", err);
            }
        }

        async function loadContext() {
            const tag = document.getElementById('tag-select').value;
            if (!tag) return;

            document.getElementById('context-json').textContent = "Cargando...";
            try {
                const response = await fetch(`/sensor/context?tag=${encodeURIComponent(tag)}`);
                const data = await response.json();
                document.getElementById('context-json').textContent = JSON.stringify(data, null, 2);

                // Poblar formulario
                if (data.metadata) {
                    document.getElementById('meta-desc').value = data.metadata.description || "";
                    document.getElementById('meta-role').value = data.metadata.process_role || "";
                    document.getElementById('meta-nmin').value = data.metadata.normal_range[0] || "";
                    document.getElementById('meta-nmax').value = data.metadata.normal_range[1] || "";
                    document.getElementById('meta-cmin').value = data.metadata.critical_range[0] || "";
                    document.getElementById('meta-cmax').value = data.metadata.critical_range[1] || "";
                    document.getElementById('meta-loc').value = data.metadata.location || "";
                    document.getElementById('meta-sys').value = data.metadata.system || "";
                    document.getElementById('meta-impact').value = data.metadata.failure_impact || "";
                    document.getElementById('meta-notes').value = data.metadata.notes || "";
                }
            } catch (err) {
                document.getElementById('context-json').textContent = "Error: " + err.message;
            }
        }

        async function saveMetadata() {
            const tag = document.getElementById('tag-select').value;
            if (!tag) return;

            const btn = document.getElementById('save-btn');
            btn.textContent = "⌛ Guardando...";
            btn.disabled = true;

            const payload = {
                tag: tag,
                description: document.getElementById('meta-desc').value,
                process_role: document.getElementById('meta-role').value,
                normal_range_min: parseFloat(document.getElementById('meta-nmin').value) || null,
                normal_range_max: parseFloat(document.getElementById('meta-nmax').value) || null,
                critical_range_min: parseFloat(document.getElementById('meta-cmin').value) || null,
                critical_range_max: parseFloat(document.getElementById('meta-cmax').value) || null,
                physical_location: document.getElementById('meta-loc').value,
                related_system: document.getElementById('meta-sys').value,
                failure_impact: document.getElementById('meta-impact').value,
                operating_notes: document.getElementById('meta-notes').value
            };

            try {
                const response = await fetch('/sensor/metadata', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (data.status === "success") {
                    alert("✅ Metadata actualizada con éxito");
                    loadContext();
                } else {
                    alert("❌ Error: " + JSON.stringify(data));
                }
            } catch (err) {
                alert("❌ Error de red: " + err.message);
            } finally {
                btn.textContent = "💾 Guardar Cambios";
                btn.disabled = false;
            }
        }

        async function sendQuestion() {
            const question = document.getElementById('user-question').value;
            const tag = document.getElementById('tag-select').value;
            if (!question) return;

            const chatOutput = document.getElementById('chat-output');
            chatOutput.innerHTML += `<div style="color: #89dceb; margin-top: 10px;"><b>Tú:</b> ${question}</div>`;
            document.getElementById('user-question').value = "";

            try {
                const response = await fetch('/ai/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tag, question })
                });
                const data = await response.json();

                chatOutput.innerHTML += `<div style="font-size: 11px; color: #6c7086;">Tag resuelto: ${data.tag || 'N/A'}</div>`;
                chatOutput.innerHTML += `<div style="background: #313244; padding: 10px; border-radius: 4px; border-left: 3px solid var(--accent);"><b>IA:</b> ${data.answer}</div>`;
                chatOutput.scrollTo(0, chatOutput.scrollHeight);
            } catch (err) {
                chatOutput.innerHTML += `<div style="color: #f38ba8;"><b>Error:</b> ${err.message}</div>`;
            }
        }

        init();
    </script>
</body>

</html>
